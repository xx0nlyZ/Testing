<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Faculty Account | CEC Faculty Portal</title>
    <link rel="stylesheet" href="../../css/register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-bg" aria-hidden="true"></div>

        <header class="auth-header">
            <img src="../../../images/cec-logo.png" alt="Cebu Eastern College logo">
            <h1>CEBU EASTERN COLLEGE</h1>
        </header>

        <section class="auth-card auth-card-padded" aria-labelledby="register-title">
            <h2 class="reg-title" id="register-title">Create Faculty Account</h2>
            <p class="reg-sub">Register to access faculty system</p>

            <form action="login.html" method="get">
                <div class="field">
                    <label for="full-name">Full Name</label>
                    <input type="text" id="full-name" name="full-name" placeholder="Enter full name" autocomplete="name" required>
                </div>

                <div class="field">
                    <label for="faculty-id">Faculty ID</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-id-badge" aria-hidden="true"></i>
                        <input type="text" id="faculty-id" name="faculty-id" placeholder="e.g. FAC - 12345" autocomplete="username" required>
                    </div>
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                        <input type="email" id="email" name="email" placeholder="e.g. email@example.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="new-password" required>
                    </div>
                </div>

                <div class="field">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-lock" aria-hidden="true"></i>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" autocomplete="new-password" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Register</button>
            </form>

            <p class="auth-switch">Already have an account? <a href="login.html">Log In</a></p>
        </section>
    </main>
<script src="../../js/showToast.js"></script>
<script src="../../js/copyToClipboard.js"></script>
<script src="../../js/confirmAction.js"></script>
<script src="../../js/avatarUpload.js"></script>
<script src="../../js/validateForm.js"></script>
<script src="../../js/persistSelect.js"></script>
<script src="../../js/setYear.js"></script>

</body>
</html>
