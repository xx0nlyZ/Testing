<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Cebu Eastern College</title>
    <link rel="stylesheet" href="../../css/recovery.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <main class="auth-page">
        <div class="auth-bg" aria-hidden="true"></div>

        <header class="auth-header">
            <img src="../../../images/cec-logo.png" alt="Cebu Eastern College logo">
            <h1>CEBU EASTERN COLLEGE</h1>
        </header>

        <section class="auth-card auth-card-padded" aria-labelledby="recovery-title">
            <div class="recovery-icon" aria-hidden="true">
                <i class="fa-solid fa-envelope envelope"></i>
                <i class="fa-solid fa-key key"></i>
            </div>

            <h2 class="recovery-title" id="recovery-title">Forgot Password?</h2>
            <p class="recovery-msg">Enter your registered email address and we'll send you a link to reset your password.</p>

            <form action="login.html" method="get">
                <div class="field">
                    <label for="email">Email</label>
                    <div class="input-icon">
                        <i class="fa-solid fa-envelope" aria-hidden="true"></i>
                        <input type="email" id="email" name="email" placeholder="Enter registered email address..." autocomplete="email" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Send Reset Link</button>
            </form>

            <div class="recovery-divider">
                <a href="login.html">Back to Log in</a>
            </div>
        </section>
    </main>
</body>
</html>
